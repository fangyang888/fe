name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main, feat/v4]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml
            component-search-mcp/pnpm-lock.yaml

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: 'python-agent/uv.lock'

      - name: Build Frontend
        run: |
          pnpm install
          pnpm run build

      - name: Build Backend
        run: |
          cd server
          pnpm install
          pnpm run build
          test -f dist/src/main.js

      - name: Build Admin
        run: |
          cd admin
          npm install
          npm run build

      - name: Build and test Component Search MCP
        run: |
          cd component-search-mcp
          pnpm install --frozen-lockfile
          pnpm test

      - name: Package searchable component sources
        run: |
          tar -czf component-search-source.tar.gz \
            package.json \
            src \
            admin/package.json \
            admin/src \
            miniapp/package.json \
            miniapp/src

      - name: Validate Python Agent
        run: |
          cd python-agent
          uv python install 3.14
          uv sync --frozen
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest

      - name: Package uv for ECS
        run: |
          mkdir -p python-agent/.deploy-bin
          cp "$(command -v uv)" python-agent/.deploy-bin/uv

      - name: Validate Agent deployment config
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_MODEL"
          if [ -n "$OPENAI_BASE_URL" ]; then
            echo "LangChain Agent will use a custom OpenAI-compatible endpoint."
          else
            echo "LangChain Agent will use the official OpenAI endpoint."
          fi
          echo "LangChain Agent deployment config is ready."

      - name: Deploy to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: 'dist/**,server/dist/**,server/package.json,server/pnpm-lock.yaml,server/sql/**,admin/dist/**,python-agent/src/**,python-agent/README.md,python-agent/pyproject.toml,python-agent/uv.lock,python-agent/.python-version,python-agent/.deploy-bin/uv,component-search-mcp/dist/**,component-search-mcp/package.json,component-search-mcp/pnpm-lock.yaml,component-search-source.tar.gz,ecosystem.config.cjs,deploy/nginx.conf'
          target: '/home/deploy/fe'
          strip_components: 0
          timeout: 120s
          command_timeout: 120s
          debug: true

      - name: Post-deployment
        uses: appleboy/ssh-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          envs: OPENAI_API_KEY,OPENAI_MODEL,OPENAI_BASE_URL
          script: |
            set -eu

            # 加载环境变量
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            [ -s "$HOME/.nvm/nvm.sh" ] && \. "$HOME/.nvm/nvm.sh"

            cd /home/deploy/fe/server

            # 动态生成 .env 文件
            umask 077
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=3306" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "PORT=3000" >> .env
            echo "SERVER_TIMEOUT_MS=900000" >> .env
            REDIS_URL="${{ secrets.REDIS_URL }}"
            if [ -z "$REDIS_URL" ]; then
              REDIS_URL="redis://127.0.0.1:6379"
            fi
            echo "REDIS_URL=$REDIS_URL" >> .env
            echo "AGENT_CHECKPOINT_REDIS_URL=$REDIS_URL" >> .env

            # 商城 / 鉴权相关配置（从 GitHub Secrets 读取）
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_EXPIRES_IN_SEC=604800" >> .env
            echo "WX_APPID=${{ secrets.WX_APPID }}" >> .env
            echo "WX_SECRET=${{ secrets.WX_SECRET }}" >> .env
            echo "DEV_OPENID=dev_openid_0001" >> .env

            # LangChain Agent（敏感值由 GitHub Actions 环境变量传入）
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> .env
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.6-sol}" >> .env
            printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-}" >> .env
            chmod 600 .env

            echo ".env file generated successfully."

            # ---- 初始化/同步商城数据库表结构（幂等，可重复执行）----
            DB_HOST="${{ secrets.DB_HOST }}"
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            DB_NAME="${{ secrets.DB_NAME }}"
            if [ -f sql/init-tables.sql ]; then
              mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < sql/init-tables.sql || echo "init-tables 执行有警告，继续"
            fi
            if [ -f sql/20260901-add-history-number-infos.sql ]; then
              mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < sql/20260901-add-history-number-infos.sql || echo "history number_infos 迁移有警告，继续"
            fi

            # ---- 创建/更新后台管理员账号（密码来自 Secret，哈希用 Node 内置 scrypt）----
            ADMIN_USER="${{ secrets.ADMIN_USER }}"
            ADMIN_PASS="${{ secrets.ADMIN_PASSWORD }}"
            if [ -n "$ADMIN_USER" ] && [ -n "$ADMIN_PASS" ]; then
              HASH=$(node -e "const{randomBytes,scryptSync}=require('crypto');const s=randomBytes(16).toString('hex');process.stdout.write(s+':'+scryptSync(process.argv[1],s,64).toString('hex'))" "$ADMIN_PASS")
              ADMIN_SQL="INSERT INTO \`user\` (\`openid\`,\`username\`,\`password\`,\`nickname\`,\`status\`) VALUES ('admin_${ADMIN_USER}','${ADMIN_USER}','${HASH}','管理员',1) ON DUPLICATE KEY UPDATE \`password\`=VALUES(\`password\`),\`status\`=1; INSERT INTO \`user_roles\` (\`user_id\`,\`role_id\`) SELECT u.id, r.id FROM \`user\` u JOIN \`role\` r ON r.code='admin' WHERE u.username='${ADMIN_USER}' ON DUPLICATE KEY UPDATE \`user_id\`=\`user_roles\`.\`user_id\`;"
              mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "$ADMIN_SQL" || echo "admin seed 有警告"
              echo "管理员账号已就绪：$ADMIN_USER"
            fi

            # ECS 的系统 Node 可能不附带 corepack，直接使用固定版本 pnpm
            npm_config_cache=/home/deploy/fe/.npm-cache npx --yes pnpm@9 install --prod --frozen-lockfile
            cd ..

            # 原子替换 MCP 检索使用的源码快照，避免已删除的组件残留在服务器上。
            rm -rf component-search-source.next
            mkdir -p component-search-source.next
            tar -xzf component-search-source.tar.gz -C component-search-source.next
            test -d component-search-source.next/src
            rm -rf component-search-source.previous
            if [ -d component-search-source ]; then
              mv component-search-source component-search-source.previous
            fi
            mv component-search-source.next component-search-source
            rm -rf component-search-source.previous component-search-source.tar.gz

            # 安装 Component Search MCP 的生产依赖。
            cd component-search-mcp
            npm_config_cache=/home/deploy/fe/.npm-cache npx --yes pnpm@9 install --prod --frozen-lockfile
            cd ..

            # 使用 CI 随发布包上传的 uv，创建隔离的 Python 3.14 运行环境。
            chmod +x python-agent/.deploy-bin/uv
            UV_CACHE_DIR=/home/deploy/fe/.uv-cache \
              python-agent/.deploy-bin/uv sync \
              --project python-agent \
              --frozen \
              --no-dev

            # 清除旧进程，再按本次配置启动 NestJS、Python Agent 和 Component Search MCP。
            pm2 delete fe-server python-agent component-search-mcp || true
            if ! pm2 start ecosystem.config.cjs --env production; then
              pm2 logs --lines 100 --nostream || true
              exit 1
            fi
            pm2 save

            # 确认 NestJS、Python Agent 和三个股票真实数据源都能访问。
            pm2 describe fe-server
            pm2 describe python-agent
            pm2 describe component-search-mcp
            if ! COMPONENT_MCP_HEALTH=$(curl --fail --show-error --max-time 15 --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3102/healthz); then
              pm2 logs component-search-mcp --lines 100 --nostream || true
              exit 1
            fi
            echo "$COMPONENT_MCP_HEALTH"
            node -e 'const health=JSON.parse(process.argv[1]);if(health.status!=="ok"){process.exit(1)}' "$COMPONENT_MCP_HEALTH"
            HISTORY_YEAR=$(date +%Y)
            if ! HISTORY_SYNC=$(curl --fail --show-error --max-time 90 --retry 5 --retry-delay 3 --retry-connrefused \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "{\"year\":${HISTORY_YEAR}}" \
              http://127.0.0.1:3000/api/history/sync-year); then
              echo "${HISTORY_YEAR} 年历史数据自动同步失败"
              pm2 logs fe-server --lines 100 --nostream || true
              exit 1
            fi
            node -e 'const result=JSON.parse(process.argv[1]);if(!Number.isInteger(result.fetched)||result.fetched<1||result.inserted+result.updated+result.skipped!==result.fetched){process.exit(1)};console.log(JSON.stringify({year:result.year,fetched:result.fetched,inserted:result.inserted,updated:result.updated,skipped:result.skipped}))' "$HISTORY_SYNC"
            if ! PYTHON_HEALTH=$(curl --fail --show-error --max-time 15 --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/api/agent/health); then
              pm2 logs python-agent --lines 100 --nostream || true
              exit 1
            fi
            echo "$PYTHON_HEALTH"
            node -e 'const health=JSON.parse(process.argv[1]);if(health.status!=="ok"||health.environment!=="production"){process.exit(1)}' "$PYTHON_HEALTH"
            if ! STOCK_HEALTH=$(curl --fail --show-error --max-time 45 --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/stock/health); then
              pm2 logs fe-server --lines 100 --nostream || true
              exit 1
            fi
            echo "$STOCK_HEALTH"
            if ! node -e 'const health=JSON.parse(process.argv[1]);if(health.status!=="ok"){process.exit(1)}' "$STOCK_HEALTH"; then
              echo "股票外部数据源未全部就绪"
              pm2 logs fe-server --lines 100 --nostream || true
              exit 1
            fi

            # 重新加载 Nginx 配置，确保长耗时预测接口不会 5 分钟 504
            sudo cp deploy/nginx.conf /etc/nginx/conf.d/fe.conf
            sudo nginx -t
            sudo systemctl reload nginx

            # 再验证一次公网入口使用的 Nginx 代理链路
            curl --fail --show-error --max-time 45 http://127.0.0.1/api/stock/health
            curl --fail --show-error --max-time 15 \
              --header 'Host: 47.106.103.79' \
              http://127.0.0.1/api/agent/health
            curl --fail --show-error --max-time 15 \
              --header 'Host: 47.106.103.79' \
              http://127.0.0.1/mcp/component-search/healthz
