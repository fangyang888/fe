server {
    listen 80;
    listen 443 ssl;
    server_name fzmall.xyz www.fzmall.xyz 47.106.103.79;

    # 证书保存在服务器上；自动部署必须保留 HTTPS 入口。
    ssl_certificate /etc/nginx/ssl/fzmall.xyz/fzmall.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/fzmall.xyz/fzmall.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态文件
    location /fe {
        alias /home/deploy/fe/dist;
        try_files $uri $uri/ /fe/index.html;

        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 管理后台静态文件（Vite 构建，base=/admin/）
    location /admin {
        alias /home/deploy/fe/admin/dist;
        try_files $uri $uri/ /admin/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Python Agent 探活入口。当前只放行健康检查，避免在迁移完成前
    # 将 NestJS 仍在提供的 /api/agent/chat、intent、stream 切走。
    location = /api/agent/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # API 反向代理到 NestJS
    location /api {
        # 图片最大 5 MB，额外预留 multipart 表单开销。
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 增加超时时间以应对复杂预测冷启动计算 (15分钟)
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 900s;
    }

    # 根路径重定向到管理后台
    location = / {
        return 301 /admin/;
    }
}
