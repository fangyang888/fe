[project]
name = "langgraph-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fangyang", email = "fangyang1@xiaoyouzi.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.29",
    "e2b==2.50.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-cli[inmem]==0.4.31",
    "langgraph-sdk>=0.4.6",
    "llama-index>=0.14.26",
    "llama-index-embeddings-openai-like==0.4.0",
    "llama-index-readers-file>=0.8.0",
    "mcp>=1.15,<2",
    "milvus-lite==3.2.2",
    "pydantic-settings>=2.15.0",
    "pymilvus==3.0.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langgraph-py = "langgraph_py:main"

[tool.uv]
# Milvus Lite uses FAISS. The 1.16.0 macOS wheels require macOS 15.
constraint-dependencies = ["faiss-cpu==1.15.1; sys_platform == 'darwin'"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
